name: SaleFix checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check kit-dashboard.js
          node --check product-extractor.js
          node --check local-server.js
          for f in api/*.js lib/*.js; do node --check "$f"; done
      - name: Unit and integration tests
        run: npm test
