name: SaleFix production smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production routing and public access
        shell: bash
        env:
          BASE_URL: https://salefix1-satyambihar422-2629s-projects.vercel.app
        run: |
          set -euo pipefail
          sleep 15  # Allow Vercel's Git deployment to assign its production alias.
          status() {
            local path="$1"
            local label="$2"
            curl --retry 1 --connect-timeout 8 --max-time 18 -sS \
              -D "/tmp/$label.headers" -o "/tmp/$label.body" \
              -w '%{http_code}' "$BASE_URL$path"
          }
          landing="$(status '/' landing)"
          script="$(status '/app.js' script)"
          api="$(status '/api/health' api)"
          echo "Landing status: $landing"
          echo "Frontend JavaScript status: $script"
          echo "API health status: $api"
          for key in landing script api; do
            echo "::group::$key route"
            grep -Ei '^HTTP/|^location:|^content-type:|^x-vercel-id:' "/tmp/$key.headers" || true
            echo "First 200 response bytes:"
            head -c 200 "/tmp/$key.body" || true
            echo
            echo "::endgroup::"
          done
          if [[ "$landing" == '200' && "$script" == '200' && "$api" == '200' ]] \
            && grep -q '<title>SaleFix' /tmp/landing.body \
            && grep -q '"ok":true' /tmp/api.body; then
            echo 'PASS: public SaleFix frontend and API are reachable.'
            exit 0
          fi
          if grep -Ei 'location:.*(vercel.com|auth|login)' /tmp/*.headers; then
            echo "::error::Vercel Authentication redirects public visitors. Set project Security > Deployment Protection to Standard Protection (production domain public) or None."
          else
            echo "::error::SaleFix did not serve expected frontend or backend responses. Review statuses and response headers above."
          fi
          exit 1
